{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Transactions</h2>

<form method="GET" action="/transactions-page" class="mb-3">

    <div class="row">

        <div class="col-md-6">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="🔍 Search Merchant"
                value="{{ search }}">

        </div>

        <div class="col-md-4">

          <select name="category" class="form-select">

    <option value="" {% if category == "" %}selected{% endif %}>
        All Categories
    </option>

    <option value="food" {% if category == "food" %}selected{% endif %}>
        Food
    </option>

    <option value="clothes" {% if category == "clothes" %}selected{% endif %}>
        Clothes
    </option>

    <option value="travel" {% if category == "travel" %}selected{% endif %}>
        Travel
    </option>

    <option value="other" {% if category == "other" %}selected{% endif %}>
        Other
    </option>

</select>

        </div>

        <div class="col-md-2">

            <button class="btn btn-primary w-100">
                Filter
            </button>

        </div>

    </div>

</form>
<div class="mb-3">

    <a href="/export-excel" class="btn btn-success me-2">
        📥 Export Excel
    </a>

    <a href="/export-pdf" class="btn btn-danger">
        📄 Export PDF
    </a>

</div>
</div>
<!-- Add Expense Form -->
<div class="card mb-4">
    <div class="card-body">

        <h4>Add New Expense</h4>

        <form action="/add-transaction" method="POST">

            <div class="mb-3">
                <label class="form-label">Merchant</label>
                <input
                    type="text"
                    name="merchant"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <input
                    type="text"
                    name="category"
                    class="form-control"
                    placeholder="Leave blank for auto category">
            </div>

            <button type="submit" class="btn btn-primary">
                Add Expense
            </button>

        </form>

    </div>
</div>

<!-- Transactions Table -->
<table class="table table-bordered table-hover">

    <thead class="table-dark">
 <tr>
    <th>ID</th>
    <th>Merchant</th>
    <th>Amount</th>
    <th>Category</th>
    <th>Date</th>
    <th>Action</th>
</tr>
    </thead>

    <tbody>

      {% for tx in transactions %}

<tr>

    <td>{{ tx.id }}</td>
    <td>{{ tx.merchant }}</td>
    <td>₹ {{ tx.amount }}</td>
    <td>{{ tx.category }}</td>
    <td>{{ tx.date }}</td>
<td>

    <a href="/edit-transaction/{{ tx.id }}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

    <form action="/delete-transaction/{{ tx.id }}"
          method="POST"
          style="display:inline;">

        <button class="btn btn-danger btn-sm">
            Delete
        </button>

    </form>

</td>

</tr>

{% endfor %}

{% endblock %}
